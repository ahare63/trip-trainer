name: Validate course data
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/validate.js
      - run: node tools/test-trip.js
      - run: node tools/test-add.js
      - run: node tools/test-timeline.js
      - run: node tools/test-notes.js
      - run: node tools/test-partner.js
      - run: node tools/test-shot.js
      - run: node tools/bundle.js
